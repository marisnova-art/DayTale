<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>인트로 모션 고르기</title>
<style>
/* 75차 인트로 시안: 고르면 이 페이지는 지워요 */
:root { --bg: #141416; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0c0c0e; color: #fff; font: 500 13px 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 40px); }
h1 { font-size: 17px; font-weight: 500; margin-bottom: 6px; }
.sub { color: rgba(255,255,255,.6); line-height: 1.6; margin-bottom: 16px; }
.all { height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #fff; color: #141416; font: inherit; font-size: 13px; margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { position: relative; aspect-ratio: 9 / 13; border-radius: 14px; overflow: hidden; background: var(--bg); display: grid; place-items: center; border: 0; color: #fff; font: inherit; }
.tile .lgo { width: 58%; height: auto; display: block; overflow: visible; }
.tile .nm { position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: rgba(255,255,255,.75); text-align: left; }
.tile .nm b { display: block; font-weight: 500; color: #fff; font-size: 17px; margin-bottom: 2px; }
.tile .home { position: absolute; inset: 0; background: linear-gradient(170deg, #3a3f7a, #141416 70%); opacity: 0; pointer-events: none; }
.tile.go .home { animation: home .5s ease 1.5s forwards; }
@keyframes home { to { opacity: 1; } }
.tile.go .stage { animation: out .5s ease 1.5s forwards; }
@keyframes out { to { opacity: 0; } }
.stage { position: absolute; inset: 0; display: grid; place-items: center; }

/* A 손글씨 (지금 75차) */
.A.go .lgo { -webkit-mask-image: linear-gradient(90deg,#000 42%,transparent 58%); mask-image: linear-gradient(90deg,#000 42%,transparent 58%); -webkit-mask-size: 260% 100%; mask-size: 260% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  animation: aW .9s cubic-bezier(.45,.05,.35,1) .1s both, glow 1s ease .9s both; }
@keyframes aW { from { -webkit-mask-position: 100% 0; mask-position: 100% 0; transform: translateY(6px); } to { -webkit-mask-position: 0 0; mask-position: 0 0; transform: none; } }
@keyframes glow { 0% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); } 45% { filter: drop-shadow(0 0 14px rgba(255,255,255,.45)); } 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); } }

/* B 선 따라 그리기: 테두리를 펜처럼 따라 그린 뒤 속이 채워져요 */
.B .lgo path { fill: transparent; stroke: #fff; stroke-width: 28; }
.B.go .lgo path { animation: bS 1.1s cubic-bezier(.5,0,.3,1) both, bF .45s ease .85s both; }
@keyframes bS { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes bF { from { fill: rgba(255,255,255,0); stroke-width: 28; } to { fill: #fff; stroke-width: 0; } }

/* C 잉크 번짐: 흐릿하게 크게 번졌다가 또렷하게 모여요 */
.C.go .lgo { animation: cI 1.2s cubic-bezier(.2,.8,.2,1) both; }
@keyframes cI { 0% { opacity: 0; filter: blur(18px); transform: scale(1.15); } 60% { opacity: 1; } 100% { opacity: 1; filter: blur(0); transform: none; } }

/* D 빛이 지나감: 조용히 나타난 뒤 빛줄기가 한 번 훑어요 */
.D .wrap { position: relative; width: 58%; }
.D .wrap .lgo { width: 100%; }
.D .shine { position: absolute; inset: -20% -10%; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.95) 50%, transparent 65%); background-size: 300% 100%; background-position: 100% 0; opacity: 0; }
.D .lgo { color: rgba(255,255,255,.8); }
.D.go .lgo { animation: fadeUp .6s ease both; }
.D.go .shine { animation: dS .8s ease .55s both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes dS { 0% { opacity: 1; background-position: 100% 0; } 100% { opacity: 1; background-position: 0 0; } }
.D .wrap { -webkit-mask-image: var(--logomask); mask-image: var(--logomask); -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }

/* E 점에서 퍼짐: 가운데 작은 빛이 커지며 로고가 드러나요 */
.E .dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: 0; }
.E.go .dot { animation: eD .7s cubic-bezier(.3,0,.2,1) both; }
@keyframes eD { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(28); } }
.E .lgo { -webkit-mask-image: radial-gradient(circle, #000 40%, transparent 60%); mask-image: radial-gradient(circle, #000 40%, transparent 60%); -webkit-mask-position: center; mask-position: center; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-size: 0 0; mask-size: 0 0; }
.E.go .lgo { animation: eM .9s cubic-bezier(.3,0,.2,1) .35s both; }
@keyframes eM { from { -webkit-mask-size: 0% 0%; mask-size: 0% 0%; } to { -webkit-mask-size: 300% 300%; mask-size: 300% 300%; } }

/* F 아래에서 떠오름: 보이지 않는 선 아래에서 올라와 살짝 튀어요 */
.F .clip { overflow: hidden; width: 58%; padding: 6% 0 10%; }
.F .clip .lgo { width: 100%; }
.F.go .clip .lgo { animation: fU .8s cubic-bezier(.3,1.4,.4,1) .1s both; }
@keyframes fU { from { transform: translateY(105%); } to { transform: none; } }

/* G 숨결: 아주 천천히 밝아지며 커져요 (가장 조용한 것) */
.G.go .lgo { animation: gB 1.3s ease-out both; }
@keyframes gB { 0% { opacity: 0; transform: scale(.94); letter-spacing: 0; } 100% { opacity: 1; transform: none; } }

/* H 손글씨 + 오늘 날짜: 로고가 써진 뒤 아래에 오늘 날짜가 한 줄 */
.H .col { display: grid; justify-items: center; gap: 10px; width: 58%; }
.H .col .lgo { width: 100%; }
.H .dt { font-size: 13px; color: rgba(255,255,255,.7); opacity: 0; }
.H.go .lgo { -webkit-mask-image: linear-gradient(90deg,#000 42%,transparent 58%); mask-image: linear-gradient(90deg,#000 42%,transparent 58%); -webkit-mask-size: 260% 100%; mask-size: 260% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; animation: aW .8s cubic-bezier(.45,.05,.35,1) both; }
.H.go .dt { animation: fadeUp .5s ease .8s both; }
</style></head>
<body>
<h1>첫 화면 인트로 고르기</h1>
<p class="sub">칸을 누르면 그 칸만 다시 움직여요. 모두 1.5초 뒤 홈(보라색)으로 넘어가요.<br>마음에 드는 걸 알파벳으로 알려 주세요.</p>
<button class="all" type="button">모두 다시</button>
<div class="grid" id="g"></div>
<script type="module" src="./js/intro-demo.js"></script>
</body></html>
